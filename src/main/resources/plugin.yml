name: NexusHouses
version: 1.4.0
main: com.nexuscraft.nexushouses.NexusHouses
api-version: '1.21'
author: RealSociety
softdepend: [NexusPulse, NexusThreshold, Vault, NexusEndeavors]
description: Great Houses -- original, GoT-flavored noble houses with a sigil and banner, a line of succession where a real death is a real political event, fealty between houses, an alliance/rivalry web, horses sworn in allegiance to your house's banner, a real treasury members can donate gold into, and admin-defined kingdoms/cities where every chest is a living, self-restocking treasure chest.

commands:
  house:
    description: Found, manage, and interact with Great Houses. Sneak-right-click your tamed horse with your house banner to swear it in. Admins can define treasure regions with /house region.
    usage: /house <create|disband|abdicate|invite|join|kick|leave|setheir|banner|info|list|swear|acceptvassal|breakfealty|ally|acceptally|breakally|rival|peace|donate|region>

permissions:
  nexushouses.admin:
    description: Force-disband a house and reload NexusHouses.
    default: op
